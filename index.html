<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preventie BVH</title>
<style>
:root{
  --ink:#16202b; --ink-soft:#5b6874; --paper:#f6f5f1; --card:#fff; --line:#dfdcd4;
  --accent:#1f5f5b; --accent-soft:#e3efee; --signal:#f2b632; --alarm:#b23b2e; --ok:#3d7a4e;
  --radius:10px; --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none !important}

#login{max-width:380px;margin:0 auto;padding:15vh 24px 40px}
#login h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
#login p.sub{margin:0 0 28px;color:var(--ink-soft);font-size:.9rem}
.field{margin-bottom:14px}
.field label{display:block;font-size:.82rem;color:var(--ink-soft);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--card)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:var(--radius);padding:11px 18px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.wide{width:100%}
.msg{font-size:.86rem;margin-top:10px;min-height:20px}
.msg.err{color:var(--alarm)} .msg.ok{color:var(--ok)}

header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(var(--safe-top) + 10px) 16px 0}
.topline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.brand{font-weight:700;letter-spacing:-.01em}
.who{margin-left:auto;font-size:.82rem;color:var(--ink-soft);display:flex;align-items:center;gap:10px}
.who button{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-size:.82rem}
select#schoolPick{padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;color:var(--ink-soft);white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:900px;margin:0 auto;padding:16px 16px 64px}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar select,.bar input{padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);max-width:220px}
.count{color:var(--ink-soft);font-size:.85rem;margin-left:auto}
.topbtn{margin-bottom:14px}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li.row{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);
  border-radius:var(--radius);padding:12px 14px;display:grid;gap:4px;cursor:pointer}
li.row:hover{border-color:#c7c2b7}
li.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row .head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.row .title{font-weight:600}
.row .meta{color:var(--ink-soft);font-size:.83rem;display:flex;gap:10px;flex-wrap:wrap}
.row.rood{border-left-color:var(--alarm)} .row.geel{border-left-color:var(--signal)}
.row.groen{border-left-color:var(--ok)} .row.grijs{border-left-color:#b9b4a9}
.tag{font-size:.74rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.rood{background:#f6e2df;color:var(--alarm)} .tag.geel{background:#fbefd3;color:#8a6516}
.tag.groen{background:#e0efe4;color:var(--ok)} .tag.grijs{background:#eceae5;color:var(--ink-soft)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:24px;text-align:center;color:var(--ink-soft)}

.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat .n{font-size:1.8rem;font-weight:700;line-height:1.1}
.stat .l{color:var(--ink-soft);font-size:.85rem}
.stat.alarm .n{color:var(--alarm)} .stat.warn .n{color:#8a6516}
h2.sec{font-size:1rem;margin:22px 0 10px}

.sheet{position:fixed;inset:0;background:rgba(22,32,43,.35);display:flex;justify-content:flex-end;z-index:20}
.sheet .panel{background:var(--paper);width:min(540px,100%);height:100%;overflow-y:auto;
  padding:calc(var(--safe-top) + 16px) 18px calc(var(--safe-bottom) + 40px)}
.panel h3{margin:0 0 2px;font-size:1.15rem}
.panel .sub{color:var(--ink-soft);font-size:.86rem;margin:0 0 16px}
.panel dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 18px;font-size:.92rem}
.panel dt{color:var(--ink-soft)} .panel dd{margin:0}
.block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.block h4{margin:0 0 10px;font-size:.92rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.closebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.closebar button{background:none;border:0;color:var(--accent);padding:0}
a.link{color:var(--accent)}
.note{font-size:.82rem;color:var(--ink-soft)}
.bijlagen{display:flex;gap:8px;flex-wrap:wrap}
.bijlagen a{display:block;font-size:.82rem;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper);color:var(--accent);text-decoration:none}
@media (max-width:520px){ .sheet{justify-content:stretch} .panel{width:100%} .bar select,.bar input{max-width:none;flex:1 1 140px} }
@media (prefers-reduced-motion:no-preference){
  .sheet .panel{animation:slide .18s ease-out}
  @keyframes slide{from{transform:translateX(18px);opacity:.6}to{transform:none;opacity:1}}
}

/* ---------- planningsraster ---------- */
.gridwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
table.grid{border-collapse:collapse;width:100%;font-size:.88rem;min-width:860px}
table.grid th{position:sticky;top:0;background:var(--card);text-align:left;font-weight:600;
  padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.grid td{padding:6px 8px;border-bottom:1px solid #eeece6;vertical-align:middle}
table.grid tr.jaar td{background:var(--accent-soft);font-weight:600;color:var(--accent)}
table.grid tr.totaal td{background:var(--paper);font-weight:600}
table.grid td.naam{min-width:240px;cursor:pointer}
table.grid td.naam:hover{text-decoration:underline}
table.grid input,table.grid select{border:1px solid transparent;background:transparent;border-radius:6px;
  padding:4px 6px;width:100%;min-width:92px}
table.grid input:hover,table.grid select:hover{border-color:var(--line)}
table.grid input:focus,table.grid select:focus{border-color:var(--accent);background:var(--card);outline:none}
table.grid input.num{text-align:right;min-width:88px}
td.geld{text-align:right;white-space:nowrap}
.bewaardmelding{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);
  color:#fff;padding:8px 16px;border-radius:999px;font-size:.85rem;z-index:30}
</style>
</head>
<body>

<section id="login">
  <h1>Preventie BVH</h1>
  <p class="sub">Meldingen, nazichten en acties van je school.</p>
  <div class="field"><label for="email">E-mailadres</label><input id="email" type="email" autocomplete="username"></div>
  <div class="field"><label for="pw">Wachtwoord</label><input id="pw" type="password" autocomplete="current-password"></div>
  <button class="btn wide" id="loginBtn">Aanmelden</button>
  <p class="msg" id="loginMsg"></p>
  <p class="note" id="hashTool"></p>
</section>

<div id="app" class="hidden">
  <header>
    <div class="topline">
      <span class="brand">Preventie BVH</span>
      <select id="schoolPick" aria-label="School"></select>
      <span class="who"><span id="whoName"></span><button id="logout">Afmelden</button></span>
    </div>
    <nav id="tabs"></nav>
  </header>
  <main><div id="view"></div></main>
</div>

<div id="sheet" class="sheet hidden"><div class="panel" id="panel"></div></div>

<script>
/* =====================================================================
   INSTELLINGEN
   ===================================================================== */
const CONFIG = {
  token: "patFMmo05sEJJ9DQf.d4978621276140a55188b555a14b478f9b4eaaebcffc615e8d38df26bbb09ac6",
  baseId: "app6AhybyyHKm9S0G"
};

const T = {
  gebruikers:"tblFDLasizJQIdqyp", scholen:"tblm7puuNpnPHmYLL",
  taken:"tblYGjDHYTpflIqZG", meldingen:"tbl3VoTGBweymxVi9", acties:"tblVSywH1xgkltedT",
  bibliotheek:"tbl4mVULjWTsE68iY"
};
/* veld-ID's, nodig om bijlagen op te laden */
const ID = { fotoMelding:"fldtoczXaA4DUh3D7", attestMelding:"fldnMWpWjOjzIUgAs" };

const F = {
  g:{ naam:"Name", email:"E-mail", hash:"Wachtwoord_Hash", gewijzigd:"Wachtwoord_Gewijzigd",
      login:"Laatste_Login", rol:"Rol", actief:"Actief", scholen:"Scholen" },
  s:{ naam:"Name", code:"Schoolcode" },
  t:{ naam:"Naam", scholen:"Scholen", taak:"Taak", taakcode:"Taakcode (from Taak)",
      omschrijving:"Omschrijving (from Taak)", uitvoerder:"Standaard uitvoerder (from Taak)",
      firma:"Externe firma", periodiciteit:"Periodiciteit", laatste:"Laatste uitvoering",
      volgende:"Volgende uitvoering", status:"Status", actief:"Actief", opmerkingen:"Opmerkingen",
      map:"Documentenmap", bvh:"BVH-proces", nazichtmeldingen:"Nazichtmeldingen",
      open:"Open nazichten", attesten:"Attesten nazichten",
      geraamd:"Geraamde kost", werkelijk:"Werkelijke kost", plan:"Opnemen in plan", actie:"Actie",
      gocode:"GO!-code" },
  m:{ nummer:"Nummer", school:"School", schoolnaam:"Schoolnaam", bron:"Bron", taak:"Taak per school",
      locatie:"Locatie", bvh:"BVH-categorie", omschrijving:"Omschrijving", foto:"Foto",
      urgentie:"Urgentie", melder:"Naam melder", melderMail:"E-mail melder", status:"Status",
      toegewezen:"Toegewezen aan gebruiker", uitgevoerd:"Uitgevoerd door", gemeld:"Datum gemeld",
      afgesloten:"Datum afgesloten", dagen:"Dagen open", opmerkingen:"Opmerkingen", attest:"Attest",
      streefdatum:"Streefdatum", geraamd:"Geraamde kost", werkelijk:"Werkelijke kost",
      plan:"Opnemen in plan", actie:"Actie", gocode:"GO!-code" },
  b:{ taakcode:"Taakcode", rubriek:"Rubriekcode", omschrijving:"Omschrijving", categorie:"Categorie",
      bvh:"BVH-proces", periodiciteit:"Periodiciteit (dagen)", waarschuwing:"Waarschuwing (dagen)",
      uitvoerder:"Standaard uitvoerder" },
  a:{ actie:"Actie", nummer:"Nummer", plan:"Plan", school:"School", thema:"Thema/ risico",
      bvh:"BVH-proces", prioriteit:"Prioriteit", doel:"Doel", aanpak:"Aanpak", uitvoerder:"Uitvoerder",
      timing:"Timing", streefdatum:"Streefdatum", schooljaar:"Schooljaar", status:"Status",
      geraamd:"Geraamde kost", werkelijk:"Werkelijke kost", gocode:"GO!-code",
      meldingen:"Meldingen 2", takenps:"Taken per school 2" }
};

const BVH = ["Elektriciteit","Gebouwen en onderhoud","HACCP en voedselveiligheid","Noodplanning",
  "Ongevallen en hulpverlening","Onthaal, aankoop en controle arbeidsmiddelen",
  "Producten met gevaarlijke eigenschappen","Valgevaar en toegankelijkheid",
  "Verwarming, ventilatie en verluchting"];
const MAANDEN = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];

/* =====================================================================
   Airtable
   ===================================================================== */
const API = "https://api.airtable.com/v0/" + CONFIG.baseId + "/";

async function at(path, opts, basis){
  const res = await fetch((basis||API) + path, Object.assign({
    headers:{ "Authorization":"Bearer " + CONFIG.token, "Content-Type":"application/json" }
  }, opts||{}));
  if(!res.ok){ throw new Error("Airtable " + res.status + ": " + (await res.text()).slice(0,180)); }
  return res.json();
}
async function listAll(table, params){
  const out=[]; let offset=null;
  do{
    const q=new URLSearchParams(params||{});
    if(offset) q.set("offset", offset);
    const data = await at(table + "?" + q.toString());
    out.push.apply(out, data.records); offset = data.offset;
  }while(offset);
  return out;
}
const patch  = (table,id,fields) => at(table+"/"+id,{method:"PATCH",body:JSON.stringify({fields})});
const create = (table,fields) => at(table,{method:"POST",body:JSON.stringify({records:[{fields}],typecast:false})});

/* bijlage opladen naar een bijlageveld (max 5 MB per bestand) */
async function uploadBijlage(recordId, veldId, file){
  const b64 = await new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1]);
    r.onerror = rej; r.readAsDataURL(file);
  });
  return at(CONFIG.baseId + "/" + recordId + "/" + veldId + "/uploadAttachment",
    { method:"POST", body: JSON.stringify({ contentType:file.type||"application/octet-stream",
      file:b64, filename:file.name }) },
    "https://content.airtable.com/v0/");
}

/* =====================================================================
   Hulpjes
   ===================================================================== */
const $ = s => document.querySelector(s);
const one = v => Array.isArray(v) ? (v.length?v[0]:"") : (v==null?"":v);
const arr = v => Array.isArray(v) ? v : (v==null||v===""?[]:[v]);
const txt = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const esc = s => String(s==null?"":s).replace(/"/g,'\\"');
const vandaag = () => new Date().toISOString().slice(0,10);
const datum = d => d ? new Date(d).toLocaleDateString("nl-BE",{day:"2-digit",month:"2-digit",year:"numeric"}) : "—";
async function sha256(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
}

const S = { user:null, rol:null, scholen:[], school:null, tab:"meldingen",
            meldingen:[], taken:[], acties:[], gebruikers:[], bibliotheek:[] };

const TABS = { meldingen:"Meldingen", nazichten:"Nazichten", acties:"Acties", planning:"Planning", overzicht:"Overzicht" };
const tabsVoorRol = rol => rol === "Werkman" ? ["meldingen"] : ["meldingen","nazichten","acties","planning","overzicht"];
const PLANSTATUS = ["Nog niet opgestart","In uitvoering","Aanvraag gebeurd","Uitgevoerd","Wordt niet uitgevoerd","Jaarlijks terugkerend"];
const euro = v => (v===null||v===undefined||v==="") ? "" : Number(v).toLocaleString("nl-BE",{minimumFractionDigits:2,maximumFractionDigits:2});
const isWerkman = () => S.rol === "Werkman";
const magBeheren = () => S.rol === "TAC" || S.rol === "Coördinator";
const magAfwerken = () => magBeheren() || isWerkman();

/* =====================================================================
   Aanmelden
   ===================================================================== */
$("#loginBtn").addEventListener("click", login);
$("#pw").addEventListener("keydown", e => { if(e.key==="Enter") login(); });

async function login(){
  const email = $("#email").value.trim().toLowerCase(), pw = $("#pw").value, msg = $("#loginMsg");
  if(!email || !pw){ msg.className="msg err"; msg.textContent="Vul je e-mailadres en wachtwoord in."; return; }
  msg.className="msg"; msg.textContent="Even geduld…"; $("#loginBtn").disabled=true;
  try{
    const recs = await listAll(T.gebruikers, { filterByFormula:`LOWER({${F.g.email}}) = "${esc(email)}"` });
    const actief = recs.filter(r => r.fields[F.g.actief] !== false);
    if(!recs.length) throw new Error("onbekend");
    if(!actief.length) throw new Error("inactief");
    const hash = await sha256(pw);
    const u = actief.find(r => String(r.fields[F.g.hash]||"").trim().toLowerCase() === hash);
    if(!u){
      if(actief.every(r => !r.fields[F.g.hash])) throw new Error("geen-hash");
      throw new Error("fout");
    }
    S.user = u; S.rol = u.fields[F.g.rol] || "Directie";
    patch(T.gebruikers, u.id, { [F.g.login]: new Date().toISOString() }).catch(()=>{});
    await startApp();
  }catch(err){
    const m = String(err.message); msg.className="msg err";
    if(m==="onbekend"||m==="fout") msg.textContent="E-mailadres of wachtwoord klopt niet.";
    else if(m==="inactief") msg.textContent="Dit account staat op niet-actief. Vraag je TAC om toegang.";
    else if(m==="geen-hash") msg.textContent="Voor dit account is nog geen wachtwoord ingesteld.";
    else msg.textContent="Aanmelden lukt niet: " + m;
  }finally{ $("#loginBtn").disabled=false; }
}
$("#logout").addEventListener("click", () => location.reload());

/* =====================================================================
   Opstarten
   ===================================================================== */
async function startApp(){
  const alle = await listAll(T.scholen, { pageSize:100 });
  const eigen = S.user.fields[F.g.scholen] || [];
  S.scholen = (S.rol === "Coördinator") ? alle : alle.filter(s => eigen.indexOf(s.id) > -1);
  if(!S.scholen.length) S.scholen = alle;
  S.school = S.scholen[0];

  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#whoName").textContent = (S.user.fields[F.g.naam] || S.user.fields[F.g.email]) + " · " + S.rol;

  const pick = $("#schoolPick");
  pick.innerHTML = S.scholen.map(s => `<option value="${s.id}">${txt(s.fields[F.s.naam])}</option>`).join("");
  pick.value = S.school.id;
  if(S.scholen.length === 1) pick.classList.add("hidden");
  pick.addEventListener("change", async () => {
    S.school = S.scholen.find(s => s.id === pick.value);
    await laadSchool(); render();
  });

  const tl = tabsVoorRol(S.rol);
  S.tab = tl[0];
  $("#tabs").innerHTML = tl.map(t => `<button data-tab="${t}">${isWerkman()&&t==="meldingen"?"Mijn taken":TABS[t]}</button>`).join("");
  if(tl.length === 1) $("#tabs").classList.add("hidden");
  $("#tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-tab]"); if(!b) return;
    S.tab = b.dataset.tab; render();
  });

  await laadSchool(); render();
}

async function laadSchool(){
  $("#view").innerHTML = `<p class="note">Gegevens ophalen…</p>`;
  const naam = esc(S.school.fields[F.s.naam]);
  const [meldingen, taken, acties, gebruikers, biblio] = await Promise.all([
    listAll(T.meldingen, { filterByFormula:`{${F.m.schoolnaam}} = "${naam}"`, pageSize:100 }),
    listAll(T.taken, { pageSize:100 }),
    listAll(T.acties, { pageSize:100 }),
    listAll(T.gebruikers, { pageSize:100 }),
    listAll(T.bibliotheek, { pageSize:100 })
  ]);
  const id = S.school.id;
  S.meldingen = meldingen;
  S.taken = taken.filter(r => (r.fields[F.t.scholen]||[]).indexOf(id) > -1);
  S.acties = acties.filter(r => (r.fields[F.a.school]||[]).indexOf(id) > -1);
  S.gebruikers = gebruikers.filter(g => (g.fields[F.g.scholen]||[]).indexOf(id) > -1 && g.fields[F.g.actief] !== false);
  S.bibliotheek = biblio.sort((a,b) => String(a.fields[F.b.omschrijving]||"").localeCompare(String(b.fields[F.b.omschrijving]||"")));
}

/* =====================================================================
   Weergave
   ===================================================================== */
function render(){
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
  if(S.tab==="meldingen") isWerkman() ? viewWerkman() : viewMeldingen();
  else if(S.tab==="nazichten") viewNazichten();
  else if(S.tab==="acties") viewActies();
  else if(S.tab==="planning") viewPlanning();
  else viewOverzicht();
}
const urgentieKleur = u => u==="Dringend" ? "rood" : (u==="Laag" ? "grijs" : "geel");
const statusKleur = s => ({ "Vervallen":"rood","Binnenkort":"geel","OK":"groen","In te plannen":"geel",
                            "Op afroep":"grijs","Niet actief":"grijs" }[s] || "grijs");
const naamVan = id => { const g = S.gebruikers.find(x => x.id === id); return g ? (g.fields[F.g.naam]||g.fields[F.g.email]) : ""; };
const eersteRegel = s => String(s||"").split("\n")[0];

function bvhOpties(sel){
  return `<option value="">Alle BVH-processen</option>` +
    BVH.map(b => `<option ${b===sel?"selected":""}>${txt(b)}</option>`).join("");
}
function maandOpties(){
  return `<option value="">Alle maanden</option>` +
    MAANDEN.map((m,i) => `<option value="${i+1}">${m}</option>`).join("");
}

/* ---------- werkman ---------- */
function viewWerkman(){
  const mijn = S.meldingen.filter(m => {
    if(m.fields[F.m.status] === "Afgewerkt") return false;
    const toe = m.fields[F.m.toegewezen] || [];
    return toe.length === 0 || toe.indexOf(S.user.id) > -1;
  });
  mijn.sort((a,b) => (b.fields[F.m.dagen]||0) - (a.fields[F.m.dagen]||0));
  $("#view").innerHTML = `
    <button class="btn topbtn" id="nieuwBtn">Iets melden</button>
    <p class="note" style="margin:-6px 0 14px">Taken die aan jou zijn toegewezen of nog vrij zijn.</p>

function kaartMelding(m){
  const f = m.fields;
  const kleur = f[F.m.status]==="Afgewerkt" ? "groen" : urgentieKleur(f[F.m.urgentie]);
  const toe = (f[F.m.toegewezen]||[]).map(naamVan).filter(Boolean).join(", ");
  return `<li class="row ${kleur}" tabindex="0" data-id="${m.id}">
    <div class="head">
      <span class="title">${txt(eersteRegel(f[F.m.omschrijving]).slice(0,90))}</span>
      <span class="tag ${kleur}">${txt(f[F.m.status]||"")}</span>

      ${f[F.m.locatie] ? `<span>${txt(f[F.m.locatie])}</span>` : ""}

      <span>${toe ? txt(toe) : "Nog niemand"}</span>
    </div></li>`;
}

function koppelLijst(sel, fn){
  const el = $(sel); if(!el) return;
  el.addEventListener("click", e => { const li = e.target.closest("li.row"); if(li) fn(li.dataset.id); });
  el.addEventListener("keydown", e => { if(e.key==="Enter"){ const li = e.target.closest("li.row"); if(li) fn(li.dataset.id); } });
}

function nieuweTaakcode(){
  const nrs = S.bibliotheek.map(b => parseInt(String(b.fields[F.b.taakcode]||"").replace(/\D/g,""),10))
    .filter(n => !isNaN(n));
  const volgend = (nrs.length ? Math.max.apply(null, nrs) : 0) + 1;
  return "T" + String(volgend).padStart(3,"0");
}

async function koppelTaak(taakId, laatste, firma){
  const velden = { [F.t.scholen]:[S.school.id], [F.t.taak]:[taakId], [F.t.actief]: true };
  if(laatste) velden[F.t.laatste] = laatste;

  return create(T.taken, velden);
}

/* ---------- melding of taak doorzetten naar het plan ---------- */
async function naarPlan(bron, soort){
  const f = bron.fields;
  const plan = soort === "melding" ? f[F.m.plan] : f[F.t.plan];
  const bestaat = soort === "melding" ? (f[F.m.actie]||[]).length : (f[F.t.actie]||[]).length;
  if(!plan || bestaat) return null;
  const titel = soort === "melding"
    ? (String(f[F.m.omschrijving]||"").split("\n")[0].slice(0,90) || "Actie uit melding")
    : ("Nazicht: " + one(f[F.t.omschrijving]));
  const velden = {
    [F.a.actie]: titel,
    [F.a.plan]: plan,
    [F.a.school]: [S.school.id],
    [F.a.status]: "Nog niet opgestart"
  };
  const bvh = soort === "melding" ? (f[F.m.bvh]||[]) : arr(f[F.t.bvh]);
  if(bvh.length) velden[F.a.bvh] = bvh;
  const go = soort === "melding" ? f[F.m.gocode] : one(f[F.t.gocode]);
  if(go) velden[F.a.gocode] = go;
  const kost = soort === "melding" ? f[F.m.geraamd] : f[F.t.geraamd];
  if(kost != null) velden[F.a.geraamd] = kost;
  const streef = soort === "melding" ? f[F.m.streefdatum] : f[F.t.volgende];
  if(streef) velden[F.a.streefdatum] = streef;
  if(soort === "melding") velden[F.a.aanpak] = "Komt voort uit melding #" + (f[F.m.nummer]||"") +
    (f[F.m.locatie] ? " (" + f[F.m.locatie] + ")" : "");
  const res = await create(T.acties, velden);
  const actieId = res.records[0].id;
  if(soort === "melding") await patch(T.meldingen, bron.id, { [F.m.actie]: [actieId] });
  else await patch(T.taken, bron.id, { [F.t.actie]: [actieId] });
  return actieId;
}

        <td><input class="num" type="number" step="0.01" min="0" data-veld="geraamd" value="${f[F.a.geraamd]!=null?f[F.a.geraamd]:""}"></td>
        <td><input class="num" type="number" step="0.01" min="0" data-veld="werkelijk" value="${f[F.a.werkelijk]!=null?f[F.a.werkelijk]:""}"></td>
        <td>${txt(f[F.a.uitvoerder]||"")}</td>
      </tr>`;
    });
    body += subtotaal();
    body += `<tr class="totaal"><td colspan="6">Totaal</td>
      <td class="geld">${totG?"€ "+euro(totG):""}</td><td class="geld">${totW?"€ "+euro(totW):""}</td><td></td></tr>`;
    $("#pGrid").innerHTML = kop + "<tbody>" + (rows.length ? body : `<tr><td colspan="9" style="padding:20px;color:var(--ink-soft)">Geen acties die hierbij passen.</td></tr>`) + "</tbody>";
  }

  teken();
  ["#pPlan","#pStatus","#pBvh"].forEach(sel => $(sel).addEventListener("input", teken));

  $("#pGrid").addEventListener("change", async e => {
    const el = e.target.closest("[data-veld]"); if(!el) return;
    const id = el.closest("tr").dataset.id, veld = el.dataset.veld;
    const waarde = (veld === "geraamd" || veld === "werkelijk")
      ? (el.value ? Number(el.value) : null)
      : ((el.value || "").trim() || null);
    el.disabled = true;
    try{
      await patch(T.acties, id, { [F.a[veld]]: waarde });
      const rec = S.acties.find(x => x.id === id);
      if(rec) rec.fields[F.a[veld]] = waarde;
      melding("Bewaard");
      if(veld !== "status") teken();
    }catch(err){ melding("Bewaren lukt niet: " + err.message); }
    finally{ el.disabled = false; }
  });

  $("#pGrid").addEventListener("click", e => {
    const td = e.target.closest("td.naam"); if(td) openActie(td.closest("tr").dataset.id);
  });

  $("#pExport").addEventListener("click", () => exportPlanning(rijen()));
}

let meldingTimer = null;
function melding(tekst){
  let el = document.querySelector(".bewaardmelding");
  if(!el){ el = document.createElement("div"); el.className = "bewaardmelding"; document.body.appendChild(el); }

function exportPlanning(rows){
  const kop = ["Streefdatum","GO!-code","Actie","Plan","Nummer","Thema","BVH-proces","Status","Uitvoerder",
               "Schooljaar","Geraamde kost","Werkelijke kost","Doel","Aanpak"];
  const veilig = v => '"' + String(v==null?"":v).replace(/"/g,'""').replace(/\r?\n/g," ") + '"';
  const lijnen = [kop.map(veilig).join(";")];
  rows.forEach(a => {
    const f = a.fields;
    lijnen.push([
      f[F.a.streefdatum] ? datum(f[F.a.streefdatum]) : "", f[F.a.gocode], f[F.a.actie], f[F.a.plan], f[F.a.nummer],
      f[F.a.thema], (f[F.a.bvh]||[]).join(", "), f[F.a.status], f[F.a.uitvoerder],
      (f[F.a.schooljaar]||[]).join(", "),
      f[F.a.geraamd]!=null ? String(f[F.a.geraamd]).replace(".",",") : "",
      f[F.a.werkelijk]!=null ? String(f[F.a.werkelijk]).replace(".",",") : "",
      f[F.a.doel], f[F.a.aanpak]
    ].map(veilig).join(";"));
  });
  const blob = new Blob(["\uFEFF" + lijnen.join("\r\n")], { type:"text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Planning " + (S.school.fields[F.s.naam]||"school") + " " + vandaag() + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function bewaarMelding(m, afwerken, neemOp){
  const msg = $("#mMsg"); msg.className="msg"; msg.textContent="Bewaren…";
  const toeSel = $("#mToe");
  const toe = neemOp || (toeSel ? toeSel.value : ((m.fields[F.m.toegewezen]||[])[0] || ""));
  const velden = { [F.m.opmerkingen]: $("#mOpm").value, [F.m.toegewezen]: toe ? [toe] : [] };
  const bvhSel = $("#mBvh");
  if(bvhSel) velden[F.m.bvh] = Array.from(bvhSel.selectedOptions).map(o => o.value);
  if($("#mGo")) velden[F.m.gocode] = $("#mGo").value.trim() || null;
  if($("#mStreef")) velden[F.m.streefdatum] = $("#mStreef").value || null;
  if($("#mGer")) velden[F.m.geraamd] = $("#mGer").value ? Number($("#mGer").value) : null;
  if($("#mWerk")) velden[F.m.werkelijk] = $("#mWerk").value ? Number($("#mWerk").value) : null;
  if($("#mPlan")) velden[F.m.plan] = $("#mPlan").value || null;
  if(afwerken){
    velden[F.m.status] = "Afgewerkt";
    velden[F.m.afgesloten] = vandaag();
    velden[F.m.uitgevoerd] = [S.user.id];
  }else if(toe && m.fields[F.m.status] === "Nieuw"){
    velden[F.m.status] = "Toegewezen";
  }
  try{
    await patch(T.meldingen, m.id, velden);
    const file = $("#mAtt") ? $("#mAtt").files[0] : null;
    if(file) await uploadBijlage(m.id, ID.attestMelding, file);
    // nazicht afgewerkt: datum bij de taak bijwerken
    if(afwerken && m.fields[F.m.bron] === "Nazicht" && (m.fields[F.m.taak]||[]).length){
      await patch(T.taken, m.fields[F.m.taak][0], { [F.t.laatste]: vandaag() });
    }
    if(velden[F.m.plan] && !(m.fields[F.m.actie]||[]).length){
      const kopie = { id:m.id, fields: Object.assign({}, m.fields, velden) };
      const nieuw = await naarPlan(kopie, "melding");
      if(nieuw) msg.textContent = "Bewaard en in het plan gezet.";
    }
    msg.className="msg ok";
    if(!msg.textContent || msg.textContent === "Bewaren…") msg.textContent = afwerken ? "Afgewerkt." : "Bewaard.";
    await laadSchool(); render();
    if(afwerken) setTimeout(sluit, 600); else openMelding(m.id);
  }catch(err){
    msg.className="msg err"; msg.textContent="Bewaren lukt niet: " + err.message;
  }
}

    ${historiek.length ? `<div class="block"><h4>Historiek</h4><ul class="list">${historiek.slice(0,6).map(m =>
      `<li class="row ${m.fields[F.m.status]==="Afgewerkt"?"groen":"geel"}" data-id="${m.id}">
        <div class="head"><span class="title">${txt(eersteRegel(m.fields[F.m.omschrijving]).slice(0,70))}</span></div>
        <div class="meta"><span>${txt(m.fields[F.m.status]||"")}</span><span>${datum(m.fields[F.m.afgesloten]||m.fields[F.m.gemeld])}</span></div>
      </li>`).join("")}</ul></div>` : ""}
  `);

  if(magAfwerken()) $("#tBewaar").addEventListener("click", () => registreerNazicht(t));
  if(magBeheren()) $("#tGegevens").addEventListener("click", () => bewaarTaak(t));
  const hist = $("#panel .block ul.list");
  if(hist) hist.addEventListener("click", e => {
    const li = e.target.closest("li.row"); if(li) openMelding(li.dataset.id);
  });
}

async function bewaarTaak(t){
  const msg = $("#tgMsg"); msg.className="msg"; msg.textContent="Bewaren…";
  try{
    await patch(T.taken, t.id, {
      [F.t.laatste]: $("#tLaatste").value || null,
      [F.t.firma]: $("#tFirma").value.trim(),
      [F.t.map]: $("#tMap").value.trim(),
      [F.t.actief]: $("#tActief").value === "ja",
      [F.t.geraamd]: $("#tGer").value ? Number($("#tGer").value) : null,
      [F.t.werkelijk]: $("#tWerk").value ? Number($("#tWerk").value) : null,
      [F.t.plan]: $("#tPlan").value || null
    });
    msg.className="msg ok"; msg.textContent="Bewaard.";
    if($("#tPlan").value && !(t.fields[F.t.actie]||[]).length){
      const kopie = { id:t.id, fields: Object.assign({}, t.fields, { [F.t.plan]: $("#tPlan").value,
        [F.t.geraamd]: $("#tGer").value ? Number($("#tGer").value) : null }) };
      const nieuw = await naarPlan(kopie, "taak");
      if(nieuw) msg.textContent = "Bewaard en in het plan gezet.";
    }
    await laadSchool(); render(); openTaak(t.id);
  }catch(err){
    msg.className="msg err"; msg.textContent="Bewaren lukt niet: " + err.message;
  }
}

async function registreerNazicht(t){
  const msg = $("#tMsg"); msg.className="msg"; msg.textContent="Bewaren…";
  const d = $("#tDatum").value || vandaag(), opm = $("#tOpm").value.trim();
  const file = $("#tAtt").files[0];
  try{
    await patch(T.taken, t.id, { [F.t.laatste]: d });
    const open = S.meldingen.filter(m => (m.fields[F.m.taak]||[]).indexOf(t.id) > -1 && m.fields[F.m.status] !== "Afgewerkt");
    let doel = open[0];
    if(!doel && (opm || file)){
      const res = await create(T.meldingen, {
        [F.m.school]:[S.school.id], [F.m.bron]:"Nazicht", [F.m.taak]:[t.id],
        [F.m.omschrijving]:"Nazicht: " + one(t.fields[F.t.omschrijving]),
        [F.m.status]:"Nieuw", [F.m.urgentie]:"Normaal",
        [F.m.gocode]: one(t.fields[F.t.gocode]) || ""
      });
      doel = res.records[0];
    }
    if(doel){
      await patch(T.meldingen, doel.id, {
        [F.m.status]:"Afgewerkt", [F.m.afgesloten]:d, [F.m.uitgevoerd]:[S.user.id],
        [F.m.opmerkingen]: opm || (doel.fields ? doel.fields[F.m.opmerkingen] : "") || ""
      });
      if(file) await uploadBijlage(doel.id, ID.attestMelding, file);
    }
    msg.className="msg ok"; msg.textContent="Geregistreerd.";
    await laadSchool(); render(); setTimeout(sluit, 600);
  }catch(err){
    msg.className="msg err"; msg.textContent="Bewaren lukt niet: " + err.message;
  }
}

/* ---------- actie ---------- */
function openActie(id){
  const a = S.acties.find(x => x.id === id); if(!a) return;
  const f = a.fields;
  const statussen = ["Nog niet opgestart","In uitvoering","Aanvraag gebeurd","Uitgevoerd","Wordt niet uitgevoerd","Jaarlijks terugkerend"];
  toon(`
    <h3>${txt(f[F.a.actie])}</h3>
    <p class="sub">${txt(f[F.a.plan]||"")}${f[F.a.nummer]?" · "+txt(f[F.a.nummer]):""}${f[F.a.thema]?" · "+txt(f[F.a.thema]):""}</p>
    <dl>
      <dt>Status</dt><dd>${txt(f[F.a.status]||"—")}</dd>
      <dt>GO!-code</dt><dd>${txt(f[F.a.gocode]||"—")}</dd>
      <dt>Timing</dt><dd>${txt(f[F.a.timing]||"—")}</dd>
      <dt>Streefdatum</dt><dd>${datum(f[F.a.streefdatum])}</dd>
      <dt>Uitvoerder</dt><dd>${txt(f[F.a.uitvoerder]||"—")}</dd>
      <dt>Schooljaar</dt><dd>${txt((f[F.a.schooljaar]||[]).join(", ")||"—")}</dd>
      ${f[F.a.geraamd]!=null ? `<dt>Geraamde kost</dt><dd>€ ${euro(f[F.a.geraamd])}</dd>` : ""}
      ${f[F.a.werkelijk]!=null ? `<dt>Werkelijke kost</dt><dd>€ ${euro(f[F.a.werkelijk])}</dd>` : ""}
    </dl>
    ${f[F.a.doel] ? `<div class="block"><h4>Doel</h4><div>${txt(f[F.a.doel]).replace(/\n/g,"<br>")}</div></div>` : ""}
    ${f[F.a.aanpak] ? `<div class="block"><h4>Aanpak</h4><div>${txt(f[F.a.aanpak]).replace(/\n/g,"<br>")}</div></div>` : ""}
    ${magBeheren() ? `
    <div class="block">
      <h4>Bijwerken</h4>
      <div class="field"><label for="aSt">Status</label><select id="aSt">${statussen.map(s=>`<option ${s===f[F.a.status]?"selected":""}>${s}</option>`).join("")}</select></div>
      ${gocodeVeld("aGo", f[F.a.gocode])}
      <div class="field"><label for="aDat">Streefdatum</label><input id="aDat" type="date" value="${f[F.a.streefdatum]||""}"></div>
      <div class="field"><label for="aGer">Geraamde kost in euro</label><input id="aGer" type="number" step="0.01" min="0" value="${f[F.a.geraamd]!=null?f[F.a.geraamd]:""}"></div>
      <div class="field"><label for="aWerk">Werkelijke kost in euro</label><input id="aWerk" type="number" step="0.01" min="0" value="${f[F.a.werkelijk]!=null?f[F.a.werkelijk]:""}"></div>
      <div class="actions"><button class="btn" id="aBewaar">Bewaren</button></div>
      <p class="msg" id="aMsg"></p>
    </div>` : ""}
  `);
  if(magBeheren()) $("#aBewaar").addEventListener("click", async () => {
    const msg = $("#aMsg"); msg.className="msg"; msg.textContent="Bewaren…";
    try{
      await patch(T.acties, a.id, { [F.a.status]: $("#aSt").value, [F.a.streefdatum]: $("#aDat").value || null,
        [F.a.gocode]: $("#aGo").value.trim() || null,
        [F.a.geraamd]: $("#aGer").value ? Number($("#aGer").value) : null,
        [F.a.werkelijk]: $("#aWerk").value ? Number($("#aWerk").value) : null });
      msg.className="msg ok"; msg.textContent="Bewaard.";
      await laadSchool(); render();
    }catch(err){ msg.className="msg err"; msg.textContent="Bewaren lukt niet: " + err.message; }
  });
}

   Hash maken:  index.html?hash
   ===================================================================== */
if(location.search.indexOf("hash") > -1){
  $("#hashTool").innerHTML = `
    <strong>Wachtwoord-hash maken</strong><br>
    <input id="hIn" type="text" placeholder="wachtwoord" style="width:100%;padding:8px;margin:6px 0;border:1px solid var(--line);border-radius:8px">
    <button class="btn sec" id="hBtn">Hash maken</button>
    <code id="hOut" style="display:block;word-break:break-all;margin-top:8px"></code>
    <span>Plak deze waarde in het veld Wachtwoord_Hash bij de gebruiker.</span>`;
  $("#hBtn").addEventListener("click", async () => { $("#hOut").textContent = await sha256($("#hIn").value); });
}
